name: Android app

# Builds the Android companion app (app/android) and publishes the APK in a GitHub release.
# Version: 0.3.<commits of the built commit>, versionCode 1000 + <commits>, tag android-v0.3.<commits>:
# the same numbers as helpers/build_android.sh on the server, so the two APKs install over each other.
# Run again on the same commit (Actions › Run workflow, e.g. after adding the signing secrets), it
# replaces the APK of that release.
# Signing: the ANDROID_* secrets below, when the repository has them; without them the APK is signed
# with a debug key that changes with every build (Android then asks to uninstall before an update).

on:
  push:
    branches: [master]
    paths:
      - 'app/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Version
        run: |
          COUNT="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=0.3.$COUNT" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + COUNT))" >> "$GITHUB_ENV"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "DISTILL_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "DISTILL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "DISTILL_KEY_ALIAS=$KEY_ALIAS"
              echo "DISTILL_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNED_WITH=release"
            } >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
          fi

      - name: Tests and APK
        working-directory: app/android
        run: >
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
          -PdistillVersionCode=$VERSION_CODE -PdistillVersionName=$VERSION_NAME

      - name: Name the APK
        run: |
          APK="distill-android-$VERSION_NAME.apk"
          cp app/android/app/build/outputs/apk/release/app-release.apk "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: distill-android-${{ env.VERSION_NAME }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$SIGNED_WITH" = release ]; then
            SIGNING="Signed with the release key: it installs over the previous version."
          else
            SIGNING="Signed with a debug key that changes with every build: uninstall the previous version before installing this one (the server address is asked again)."
          fi
          cat > notes.md <<EOF
          Distill for Android $VERSION_NAME, built by GitHub Actions from ${GITHUB_SHA::7}.

          The companion app of distill-web: enter the address of your server and sign in with the administrator of the site. Then follow the server and its jobs (Overview), start a training (Train), an evaluation (Evaluate) or an installation on the comma (Comma), or use the whole site (Website).

          Install: download \`$APK\` on the phone and open it (allow installing apps from this source). Android 8.0 or newer.

          $SIGNING

          SHA-256: \`$SHA256\`
          EOF
          TAG="android-v$VERSION_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Distill for Android $VERSION_NAME" --notes-file notes.md
          fi
