[project]
name = "openpilot-distill"
version = "0.1.0"
description = "Driving-segment localization and policy-learning experiments"
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
license = {text = "MIT"}
dependencies = [
  "comma-deps-raylib",
  "dill",
  "einops>=0.8",
  "fastapi",
  "huggingface-hub",
  "laika @ git+https://github.com/commaai/laika@a73329b819e2e1ab270a50b40e469ed2111845d3",
  "numpy>=2.0",
  "opencv-python-headless",
  "openpilot @ https://github.com/commaai/openpilot/archive/084747c75d2cbd23af65ab7a9e770bbd7b98bac9.tar.gz",
  "opendbc @ https://github.com/commaai/opendbc/archive/7343a66d46213d5f73528afc6c6db713ebd88a9d.tar.gz",
  "pynvvideocodec>=2.1",
  "safetensors",
  "spmd-types==0.2.1",
  "torch==2.13.0",
  "torchao",
  "torchvision",
  "uvicorn",
  "wandb",
  "timm >=0.9.8",
  "reverse_geocoder",
  "onnx>=1.22.0",
  "onnxruntime-gpu",
]

[project.optional-dependencies]
# Tesla V100 / Volta (sm_70): `uv sync --extra v100`, and then `uv run --extra v100 ...` (a plain
# `uv run` re-syncs the default CUDA 13 stack, which has no sm_70 kernels). The helpers do this
# through DISTILL_UV_EXTRA=v100 in the repo .env (helpers/common.sh).
# Same packages as the base dependencies, taken from CUDA 12 builds that still ship sm_70 kernels
# (see [tool.uv.sources]). A package must be listed here for its extra-scoped source to apply.
v100 = ["torch==2.13.0", "torchvision", "onnxruntime-gpu"]
# The default CUDA 13 stack. Empty: it only exists because a conflict set needs two entries.
cuda13 = []

[dependency-groups]
dev = [
  "ruff>=0.11",
]

[tool.uv]
package = false
# Without this conflict uv merges the extra-scoped sources into the default resolution and every
# Linux user silently gets the cu126 builds. With it, plain `uv sync` resolves exactly like upstream.
conflicts = [[{ extra = "v100" }, { extra = "cuda13" }]]
# Only reached through the v100 extra: torch cu126 pins nvidia-cuda-runtime-cu12==12.6.77, but
# onnxruntime-gpu 1.29 (CUDA 12 feed) needs libcudart >= 12.8 (cudaLibraryGetKernel & co.): with 12.6
# its CUDA provider does not load and the teacher runs on CPU (~300 s/step, >12 GB RAM). A 12.9 runtime
# still runs torch cu126 and Volta. The default CUDA 13 stack has no *-cu12 package, so this does not
# change it. Do not scope it with `; extra == 'v100'`: uv then drops cudart altogether (broken env).
override-dependencies = ["nvidia-cuda-runtime-cu12==12.9.79"]

# Tesla V100 (Volta, sm_70): the default PyPI torch is built for CUDA 13, which dropped Volta.
# The cu126 builds still ship sm_70 kernels.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# The PyPI onnxruntime-gpu 1.29 is built for CUDA 13 (no sm_70); Microsoft's CUDA 12 feed keeps Volta.
[[tool.uv.index]]
name = "onnxruntime-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

# Applied only with the v100 extra, on Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "v100", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", extra = "v100", marker = "sys_platform == 'linux'" }]
onnxruntime-gpu = [{ index = "onnxruntime-cuda-12", extra = "v100", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "PIE", "UP"]
